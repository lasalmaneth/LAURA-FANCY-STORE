<section class="contact" id="contact" aria-label="Contact">
  <div class="contact__wrapper">
    <div class="contact__left">
      <span class="section-tag">// 04</span>
      <h2 class="contact__title">GET IN TOUCH</h2>
      <p class="contact__desc">Have a piece in mind? Want to visit the workshop? Commission a custom order? We'd love to hear from you.</p>
      <div class="contact__details">
        <div class="contact-row">
          <span class="contact-label">EMAIL</span>
          <span class="contact-val">hello@laurafancystore.com</span>
        </div>
        <div class="contact-row">
          <span class="contact-label">LOCATION</span>
          <span class="contact-val">Portland, Oregon</span>
        </div>
        <div class="contact-row">
          <span class="contact-label">STUDIO VISITS</span>
          <span class="contact-val">By appointment</span>
        </div>
      </div>
    </div>

    <div class="contact__right">
      <form class="contact-form" id="contact-form" novalidate>
        <div class="form-group">
          <label for="contact-name">NAME</label>
          <input type="text" id="contact-name" name="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="contact-email">EMAIL</label>
          <input type="email" id="contact-email" name="email" placeholder="your@email.com" required />
        </div>
        <div class="form-group">
          <label for="contact-interest">INTEREST</label>
          <select id="contact-interest" name="interest">
            <option value="">— Select —</option>
            <option value="chair">Oak Side Chair</option>
            <option value="table">Dining Table</option>
            <option value="shelf">Wall Shelf Unit</option>
            <option value="custom">Custom Commission</option>
            <option value="visit">Studio Visit</option>
          </select>
        </div>
        <div class="form-group">
          <label for="contact-message">MESSAGE</label>
          <textarea id="contact-message" name="message" rows="4" placeholder="Tell us about your project..."></textarea>
        </div>
        <button type="submit" id="submit-btn" class="btn btn--primary btn--full">Send Message</button>
        <div class="form-success" id="form-success" style="display:none" role="alert">
          ✦ Message received. We'll be in touch within 2 business days.
        </div>
      </form>
    </div>
  </div>
</section>
