<section class="newsletter" aria-label="Newsletter signup">
  <div class="newsletter__inner">
    <h2 class="newsletter__title">JOIN THE LIST</h2>
    <p class="newsletter__sub">Be first to know about new pieces, limited runs, and workshop events.</p>
    <form class="newsletter__form" id="newsletter-form" novalidate>
      <input type="email" id="newsletter-email" name="email" placeholder="Enter your email address" required />
      <button type="submit" id="newsletter-btn" class="btn btn--primary">Subscribe</button>
    </form>
    <div class="newsletter__success" id="newsletter-success" style="display:none" role="alert">
      ✦ You're on the list. Thank you.
    </div>
  </div>
</section>
